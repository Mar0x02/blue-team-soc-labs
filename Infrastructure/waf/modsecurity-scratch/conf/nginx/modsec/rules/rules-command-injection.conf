SecRule ARGS,ARGS_NAMES,REQUEST_HEADERS "@rx (?i)(?:[;|&\x60]|\$\(|\|\|)\s*(?:whoami|id|uname|hostname|wget|curl|nc|cat\s+/etc/passwd|cat\s+/etc/shadow|cat\s+/etc/group|cat\s+/etc/hosts|cat\s+/etc/issue|cat\s+/etc/lsb-release|cat\s+/etc/redhat-release|cat\s+/etc/debian_version|cat\s+/proc/version)\b(?!=)" \
    "id:100005, \
    phase:2, \
    deny, \
    nolog, \
    auditlog, \
    t:none,t:urlDecodeUni,t:lowercase,t:htmlEntityDecode, \
    msg:'Command Injection Attack Detected', \
    severity:CRITICAL, \
    tag:'paranoia-level/1', \
    tag:'attack-command-injection'"