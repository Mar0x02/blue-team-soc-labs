SecRule ARGS,ARGS_NAMES,REQUEST_HEADERS,REQUEST_BODY "@rx (?i)(?:\.\./|\.\.\\|/etc/passwd|/proc/self/environ|/bin/bash|/bin/sh|/usr/bin/perl|/usr/bin/python|/usr/bin/ruby|/usr/bin/php|/usr/bin/node|/usr/bin/java|/usr/bin/gcc|/usr/bin/make|/usr/bin/curl|/usr/bin/wget|/usr/bin/nc|/usr/bin/telnet|/usr/bin/socat)\b" \
    "id:100004, \
    phase:2, \
    deny, \
    nolog, \
    auditlog, \
    t:none,t:urlDecodeUni,t:lowercase,t:htmlEntityDecode, \
    msg:'Path Traversal Attack Detected', \
    severity:CRITICAL, \
    tag:'paranoia-level/1', \
    tag:'attack-path-traversal'"