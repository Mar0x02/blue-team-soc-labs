detect:
    event: NEW_PROCESS
    op: and
    rules:
        - op: starts with
          path: event/PARENT/FILE_PATH
          value: /tmp
        
        - op: or
          rules:
            - op: ends with
              path: event/FILE_PATH
              value: sudo
            - op: ends with
              path: event/FILE_PATH
              value: dash
        
respond:
  - action: report
    name: "CRITICAL: Sudo Call from script /tmp!"
    priority: 5
  - action: task
    command: os_kill_process --pid {{ .event.PROCESS_ID }}