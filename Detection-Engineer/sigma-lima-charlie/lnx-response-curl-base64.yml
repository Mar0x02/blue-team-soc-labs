detect:
    event: NEW_PROCESS
    op: or
    rules:
        - op: contains
          path: event/COMMAND_LINE
          value: curl
        - op: contains
          path: event/COMMAND_LINE
          value: wget

respond:
  - action: report
    name: "CRITICAL: Curl/Wget Download from Tmp-Spawned Process"
    priority: 5  # Highest priority
  - action: task
    command: os_kill_process --pid {{ .event.PARENT_PROCESS_ID }}
  - action: add tag
    tag: curl_download_from_tmp
    ttl: 86400
