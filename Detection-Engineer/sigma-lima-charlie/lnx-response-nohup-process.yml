detect:
    event: NEW_PROCESS
    op: and
    rules:
        - op: ends with
          path: event/FILE_PATH
          value: nohup

        - op: or
          rules:
            - op: contains
              path: event/COMMAND_LINE
              value: bash
            - op: contains
              path: event/COMMAND_LINE
              value: zsh
            - op: contains
              path: event/COMMAND_LINE
              value: .sh
            - op: contains
              path: event/COMMAND_LINE
              value: .py
            - op: contains
              path: event/COMMAND_LINE
              value: .pl
            - op: contains
              path: event/COMMAND_LINE
              value: .rb
            - op: contains
              path: event/COMMAND_LINE
              value: .js
            - op: contains
              path: event/COMMAND_LINE
              value: .mjs
            - op: contains
              path: event/COMMAND_LINE
              value: .go

respond:
  - action: report
    name: "CRITICAL: Nohup Executed from Tmp-Spawned Process"
    priority: 5  # Highest priority
  - action: task
    command: os_kill_process --pid {{ .event.PROCESS_ID }}
  - action: add tag
    tag: nohup-exec
    ttl: 86400