detect:
    event: NEW_PROCESS
    op: and
    rules:
        - op: starts with
          path: event/FILE_PATH
          value: /tmp
        
        - op: or
          rules:
            - op: contains
              path: event/COMMAND_LINE
              value: bash
            - op: contains
              path: event/COMMAND_LINE
              value: sh
            - op: contains
              path: event/COMMAND_LINE
              value: zsh
            - op: contains
              path: event/COMMAND_LINE
              value: .sh
            - op: contains
              path: event/COMMAND_LINE
              value: .py
            - op: contains
              path: event/COMMAND_LINE
              value: .pl
            - op: contains
              path: event/COMMAND_LINE
              value: .rb
            - op: contains
              path: event/COMMAND_LINE
              value: .js
            - op: contains
              path: event/COMMAND_LINE
              value: .mjs
            - op: contains
              path: event/COMMAND_LINE
              value: .go
respond:
  - action: report
    name: "Linux Execution File from Temp Or System Dir - {{ .event.FILE_PATH }}"
    priority: 2
  - action: add tag
    tag: suspicious_execution
    ttl: 3600 