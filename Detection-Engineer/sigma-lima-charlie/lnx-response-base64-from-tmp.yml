detect:
    event: NEW_PROCESS
    op: and
    rules:
        - op: ends with
          path: event/FILE_PATH
          value: base64

        - op: or
          rules:
            - op: contains
              path: event/COMMAND_LINE
              value: base64 -d
            - op: contains
              path: event/COMMAND_LINE
              value: base64 --decode
            - op: contains
              path: event/COMMAND_LINE
              value: gzip -d
            - op: contains
              path: event/COMMAND_LINE
              value: gzip --decompress
            - op: contains
              path: event/COMMAND_LINE
              value: gzip -c
            - op: contains
              path: event/COMMAND_LINE
              value: gzip --stdout
            - op: contains
              path: event/COMMAND_LINE
              value: gzip -dc

respond:
  - action: report
    name: "CRITICAL: Base64/Gzip Decode Executed from Tmp-Spawned Process"
    priority: 5  # Highest priority
  - action: task
    command: os_kill_process --pid {{ .event.PARENT_PROCESS_ID }}
  - action: add tag
    tag: base64_payload_execution_from_tmp
    ttl: 86400