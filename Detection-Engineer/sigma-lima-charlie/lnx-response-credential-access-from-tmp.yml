detect:
    event: NEW_PROCESS
    op: or
    rules:
        - op: contains
          path: event/COMMAND_LINE
          value: /etc/shadow
        - op: contains
          path: event/COMMAND_LINE
          value: /etc/passwd

respond:
  - action: report
    name: "CRITICAL: Credential File Access from Tmp-Spawned Process"
    priority: 5
  - action: task
    command: os_kill_process --pid {{ .event.PARENT_PROCESS_ID }}
  - action: add tag
    tag: credential_access_from_tmp
    ttl: 86400
